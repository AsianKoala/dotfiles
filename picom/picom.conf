# picom v13 — "clean beautiful" tuning: just fade + subtle shadow + rounded corners
# (intentionally no window-open/close animations — that's the flashy-rice look)

backend = "glx";
vsync = true;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
unredir-if-possible = false;

# ── rounded corners ────────────────────────────────────────────────
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
];

# ── shadows (subtle, only floating windows) ───────────────────────
shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-opacity = 0.35;
shadow-color = "#000000";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@",
];

# ── fade (the one animation that always reads as "polished") ─────
fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 5;

# ── opacity / dim ─────────────────────────────────────────────────
inactive-opacity = 0.97;
active-opacity = 1.0;
inactive-dim = 0.05;
frame-opacity = 1.0;
opacity-rule = [
  "100:class_g = 'Polybar'",
  "100:fullscreen",
];

# ── no blur (off for "clean" look; background_opacity in kitty alone is enough)
blur-background = false;

# ── no window animations (keeps the look calm) ───────────────────
animations = (
  { triggers = ["open", "show", "close", "hide"]; preset = "appear"; suppressions = ["close"]; },
);

# ── wintypes ──────────────────────────────────────────────────────
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.97; shadow = true; };
  dropdown_menu = { opacity = 0.97; shadow = true; };
  menu = { shadow = true; };
  utility = { shadow = false; };
  notification = { shadow = true; };
  splash = { shadow = false; };
};
