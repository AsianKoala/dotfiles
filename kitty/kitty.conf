# vim:fileencoding=utf-8:foldmethod=marker

font_family       JetBrainsMono Nerd Font
bold_font         JetBrainsMono Nerd Font Bold
italic_font       JetBrainsMono Nerd Font Italic
bold_italic_font  JetBrainsMono Nerd Font Bold Italic
font_size 13.0

# breathing room
window_padding_width 18
single_window_margin_width 0
modify_font cell_height +1px

# no title bar / traffic lights, but keep macOS rounded corners (so JankyBorders'
# round style has a curve to trace). `yes` would also square the corners.
hide_window_decorations titlebar-only

enable_audio_bell no

# theme colors from pywal (nia palette). Placed BEFORE background_opacity so the
# palette's alpha=100 doesn't clobber the transparency set below. On a fresh macOS
# box without pywal, an empty placeholder at this path keeps the include from warning.
include ~/.cache/wal/colors-kitty.conf

background_opacity 0.93
dynamic_background_opacity yes

allow_remote_control yes

# macOS: treat left/right Option as Alt so tmux M-/nvim <A-> binds work
# (no-op on Linux, where kitty ignores this directive)
macos_option_as_alt yes

# inactive splits dim slightly so the active one pops
inactive_text_alpha 0.85

# native cursor smear/trail (kitty v0.36+) — terminal-wide, covers nvim too
cursor_trail 500
cursor_trail_decay 0.10 0.40
cursor_trail_start_threshold 2

clipboard_control write-clipboard write-primary read-clipboard read-primary
