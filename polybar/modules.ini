[module/workspaces]
type = internal/xworkspaces

; Only show workspaces defined on the same output as the bar
;
; Useful if you want to show monitor specific workspaces
; on different bars
;
; Default: false
pin-workspaces = true

; Create click handler used to focus desktop
; Default: true
enable-click = true

; Create scroll handlers used to cycle desktops
; Default: true
enable-scroll = true

; icon-[0-9]+ = <desktop-name>;<icon>
; NOTE: The desktop name needs to match the name configured by the WM
; You can get a list of the defined desktops using:
; $ xprop -root _NET_DESKTOP_NAMES
; icon-0 = 1;
; icon-1 = 2;
; icon-2 = 3;
; icon-3 = 4;
; icon-4 = 5;
; icon-default = 

; Label mapping depends on monitor layout. pin-workspaces = true scopes each
; bar to its monitor's desktops, so each bar shows the same number range.
{% if "displaylink2" in profiles or "displaylink3" in profiles %}
; laptop + external displays: 5 desktops per monitor, relative 1..5 per bar
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;1
icon-6 = 7;2
icon-7 = 8;3
icon-8 = 9;4
icon-9 = 10;5
icon-10 = 11;1
icon-11 = 12;2
icon-12 = 13;3
icon-13 = 14;4
icon-14 = 15;5
{% elif "laptop" in profiles %}
; laptop-only: single monitor owns all 10 desktops, label = global name
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;10
{% else %}
; home / edward / desktop: 5 desktops per monitor, relative 1..5 per bar
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;1
icon-6 = 7;2
icon-7 = 8;3
icon-8 = 9;4
icon-9 = 10;5
icon-10 = 11;1
icon-11 = 12;2
icon-12 = 13;3
icon-13 = 14;4
icon-14 = 15;5
{% endif %}
icon-default = ●

; Available tags:
;   <label-monitor>
;   <label-state> - gets replaced with <label-(active|urgent|occupied|empty)>
; Default: <label-state>
format = <label-state>
format-padding = 0

; Available tokens:
;   %name%
; Default: %name%
label-monitor = %name%

; minimal: only the focused desktop renders, others collapse to nothing
label-active = %icon%
label-active-foreground = ${color.foreground}
label-active-background = ${color.primary}
label-active-padding = 2
label-active-font = 1

label-occupied =
label-empty =
label-urgent = %icon%
label-urgent-foreground = ${color.secondary}
label-urgent-padding = 1
label-urgent-font = 2




